<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jane的生活日記</title>
<style>
  :root {
    --bg-color: #FDFBF7;
    --card-bg: #FFFFFF;
    --text-main: #4A403A;
    --text-secondary: #8C7B70;
    --text-light: #B5A496;
    --border-color: #EFECE6;
    --border-light: #F5F2EC;
    --row-even: #FCFBF9;
    --tag-bg: #F3EFEA;
    --accent-color: #D9C5B2;
    --accent-hover: #C5B09D;
    --shadow: 0 4px 12px rgba(181, 164, 150, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
    margin: 0;
    padding: 20px 12px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background-color: var(--card-bg);
    padding: 24px 18px;
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .header-box {
    text-align: center;
    margin-bottom: 25px;
  }

  h1 {
    color: var(--text-secondary);
    font-size: 26px;
    margin: 0 0 6px 0;
    letter-spacing: 1px;
  }

  .subtitle {
    color: var(--text-light);
    font-size: 14px;
    margin: 0;
  }

  /* 左右按鈕切換列 */
  .date-nav-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 15px;
  }

  .date-nav-btn {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .date-nav-btn:hover {
    background-color: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  .current-date-display {
    font-size: 18px;
    font-weight: bold;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    min-width: 120px;
    text-align: center;
  }

  h2 {
    color: var(--text-secondary);
    font-size: 18px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 6px;
    margin-top: 30px;
  }

  /* 輸入框群組 */
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .input-group input[type="text"] {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background-color: var(--bg-color);
    font-size: 13px;
    outline: none;
  }

  .input-group input.title-input { flex: 2; }
  .input-group input.tag-input { flex: 1; }

  .input-group button {
    padding: 8px 16px;
    background-color: var(--accent-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .input-group button:hover {
    background-color: var(--accent-hover);
  }

  /* 待辦事項列表 */
  ul.task-list {
    list-style: none;
    padding: 0;
    margin: 10px 0;
  }

  li.task-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background-color: var(--bg-color);
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    flex: 1;
    font-size: 14px;
  }

  .task-item input[type="checkbox"] {
    accent-color: var(--text-secondary);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .task-item.completed span.task-text {
    text-decoration: line-through;
    color: var(--text-light);
  }

  .tag {
    display: inline-block;
    background-color: var(--tag-bg);
    color: var(--text-secondary);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    margin-left: 6px;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 14px;
    cursor: pointer;
    padding: 0 6px;
  }

  .delete-btn:hover { color: #E57373; }

  /* 月曆網格區塊 */
  .calendar-grid-wrapper {
    margin-top: 15px;
    margin-bottom: 25px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .weekday-header {
    text-align: center;
    font-weight: bold;
    color: var(--text-secondary);
    padding: 6px 0;
    background-color: var(--border-color);
    border-radius: 6px;
    font-size: 13px;
  }

  .grid-day-cell {
    min-height: 60px;
    background-color: var(--bg-color);
    border-radius: 8px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .grid-day-cell:hover {
    border-color: var(--accent-color);
    background-color: #FFF;
  }

  .grid-day-cell.empty {
    background-color: transparent;
    cursor: default;
    border: none;
  }

  .grid-day-num {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-secondary);
  }

  .grid-day-event {
    font-size: 10px;
    color: var(--text-main);
    background: #FFF;
    padding: 2px 4px;
    border-radius: 4px;
    border-left: 2px solid var(--accent-color);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  /* 表格區塊 */
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-top: 15px;
    margin-bottom: 20px;
  }

  th {
    background-color: var(--border-color);
    color: var(--text-secondary);
    font-weight: bold;
    text-align: left;
    padding: 12px 14px;
    font-size: 14px;
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-light);
    font-size: 13px;
    color: var(--text-main);
  }

  .table-input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-main);
    padding: 6px 8px;
    border-radius: 6px;
    outline: none;
    transition: all 0.2s;
  }

  .table-input:hover, .table-input:focus {
    background: var(--bg-color);
    border-color: var(--accent-color);
  }

  tr.highlight-row {
    background-color: #F7EFE6 !important;
    transition: background-color 2s ease;
  }

  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) { background-color: var(--row-even); }

  @media (max-width: 600px) {
    body { padding: 10px 6px; }
    .container { padding: 16px 12px; }
    table, th, td { font-size: 12px; padding: 8px 6px; }
    .input-group { flex-direction: column; }
    .grid-day-cell { min-height: 50px; padding: 3px; }
    .grid-day-num { font-size: 11px; }
    .grid-day-event { font-size: 9px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <h1>☕ Jane的生活日記</h1>
    <div class="subtitle">質感日常與專屬行程規劃</div>
    <div class="date-nav-bar">
      <button class="date-nav-btn" onclick="changeMonth(-1)">❮</button>
      <div class="current-date-display" id="currentDateDisplay">2026 年 11 月</div>
      <button class="date-nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
  </div>

  <h2>📌 當月大重點 (Monthly Goals)</h2>
  <div class="input-group">
    <input type="text" id="monthGoalInput" class="title-input" placeholder="新增本月核心目標或重點事項...">
    <button onclick="addMonthGoal()">新增目標</button>
  </div>
  <ul class="task-list" id="monthGoalList"></ul>

  <h2>✨ 每日循環 / 固定待辦事項 (Daily Routines)</h2>
  <div class="input-group">
    <input type="text" id="dailyInput" class="title-input" placeholder="新增固定日常事項 (如：Omo! Sindy 營運...)">
    <input type="text" id="dailyTagInput" class="tag-input" placeholder="標籤 (如：選品店)">
    <button onclick="addDailyTask()">新增</button>
  </div>
  <ul class="task-list" id="dailyList"></ul>

  <h2>🌿 每週 / 階段性一般待辦事項</h2>
  <div class="input-group">
    <input type="text" id="weeklyInput" class="title-input" placeholder="新增每週待辦事項 (如：庫存與耗材盤點...)">
    <input type="text" id="weeklyTagInput" class="tag-input" placeholder="標籤 (如：採購)">
    <button onclick="addWeeklyTask()">新增</button>
  </div>
  <ul class="task-list" id="weeklyList"></ul>

  <h2>🗓️ 月曆概覽 <span style="font-size: 12px; font-weight: normal; color: var(--text-light);">(點擊日期直接帶入下方編輯)</span></h2>
  <div class="calendar-grid-wrapper">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <h2>📅 每日行事曆與重點待辦</h2>
  <table>
    <thead>
      <tr>
        <th style="width: 15%;">日期</th>
        <th style="width: 15%;">星期</th>
        <th>重點行程與專屬待辦事項</th>
      </tr>
    </thead>
    <tbody id="calendarTableBody"></tbody>
  </table>
</div>

<script>
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth() + 1; // 1-12

  let dailyTasks = JSON.parse(localStorage.getItem('my_blank_daily')) || [];
  let weeklyTasks = JSON.parse(localStorage.getItem('my_blank_weekly')) || [];
  let monthGoals = JSON.parse(localStorage.getItem('my_month_goals')) || {};
  let events = JSON.parse(localStorage.getItem('my_blank_events')) || {};

  function init() {
    updateDateDisplay();
    renderDailyTasks();
    renderWeeklyTasks();
    onDateChange();
  }

  function changeMonth(direction) {
    currentMonth += direction;
    if (currentMonth > 12) {
      currentMonth = 1;
      currentYear++;
    } else if (currentMonth < 1) {
      currentMonth = 12;
      currentYear--;
    }
    updateDateDisplay();
    onDateChange();
  }

  function updateDateDisplay() {
    document.getElementById('currentDateDisplay').textContent = `${currentYear} 年 ${currentMonth} 月`;
  }

  function onDateChange() {
    renderMonthGoals();
    renderCalendarGrid();
    renderCalendarTable();
  }

  function getMonthKey() {
    return `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
  }

  function addMonthGoal() {
    const input = document.getElementById('monthGoalInput');
    const text = input.value.trim();
    if (!text) return;

    const mKey = getMonthKey();
    if (!monthGoals[mKey]) monthGoals[mKey] = [];
    monthGoals[mKey].push({ id: Date.now(), text: text, done: false });
    input.value = '';
    saveData();
    renderMonthGoals();
  }

  function toggleMonthGoal(id) {
    const mKey = getMonthKey();
    if (monthGoals[mKey]) {
      monthGoals[mKey] = monthGoals[mKey].map(g => g.id === id ? { ...g, done: !g.done } : g);
      saveData();
      renderMonthGoals();
    }
  }

  function deleteMonthGoal(id) {
    const mKey = getMonthKey();
    if (monthGoals[mKey]) {
      monthGoals[mKey] = monthGoals[mKey].filter(g => g.id !== id);
      saveData();
      renderMonthGoals();
    }
  }

  function renderMonthGoals() {
    const list = document.getElementById('monthGoalList');
    list.innerHTML = '';
    const mKey = getMonthKey();
    const currentGoals = monthGoals[mKey] || [];

    currentGoals.forEach(g => {
      const li = document.createElement('li');
      li.className = 'task-row';
      li.innerHTML = `
        <label class="task-item ${g.done ? 'completed' : ''}">
          <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleMonthGoal(${g.id})">
          <span class="task-text">${escapeHtml(g.text)}</span>
        </label>
        <button class="delete-btn" onclick="deleteMonthGoal(${g.id})">✕</button>
      `;
      list.appendChild(li);
    });
  }

  function addDailyTask() {
    const textInput = document.getElementById('dailyInput');
    const tagInput = document.getElementById('dailyTagInput');
    const text = textInput.value.trim();
    if (!text) return;

    dailyTasks.push({ id: Date.now(), text: text, tag: tagInput.value.trim(), done: false });
    textInput.value = '';
    tagInput.value = '';
    saveData();
    renderDailyTasks();
  }

  function toggleDaily(id) {
    dailyTasks = dailyTasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    saveData();
    renderDailyTasks();
  }

  function deleteDaily(id) {
    dailyTasks = dailyTasks.filter(t => t.id !== id);
    saveData();
    renderDailyTasks();
  }

  function renderDailyTasks() {
    const list = document.getElementById('dailyList');
    list.innerHTML = '';
    dailyTasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-row';
      li.innerHTML = `
        <label class="task-item ${task.done ? 'completed' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleDaily(${task.id})">
          <span class="task-text">${escapeHtml(task.text)}</span>
          ${task.tag ? `<span class="tag">${escapeHtml(task.tag)}</span>` : ''}
        </label>
        <button class="delete-btn" onclick="deleteDaily(${task.id})">✕</button>
      `;
      list.appendChild(li);
    });
  }

  function addWeeklyTask() {
    const textInput = document.getElementById('weeklyInput');
    const tagInput = document.getElementById('weeklyTagInput');
    const text = textInput.value.trim();
    if (!text) return;

    weeklyTasks.push({ id: Date.now(), text: text, tag: tagInput.value.trim(), done: false });
    textInput.value = '';
    tagInput.value = '';
    saveData();
    renderWeeklyTasks();
  }

  function toggleWeekly(id) {
    weeklyTasks = weeklyTasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    saveData();
    renderWeeklyTasks();
  }

  function deleteWeekly(id) {
    weeklyTasks = weeklyTasks.filter(t => t.id !== id);
    saveData();
    renderWeeklyTasks();
  }

  function renderWeeklyTasks() {
    const list = document.getElementById('weeklyList');
    list.innerHTML = '';
    weeklyTasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-row';
      li.innerHTML = `
        <label class="task-item ${task.done ? 'completed' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleWeekly(${task.id})">
          <span class="task-text">${escapeHtml(task.text)}</span>
          ${task.tag ? `<span class="tag">${escapeHtml(task.tag)}</span>` : ''}
        </label>
        <button class="delete-btn" onclick="deleteWeekly(${task.id})">✕</button>
      `;
      list.appendChild(li);
    });
  }

  function renderCalendarGrid() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(w => {
      const header = document.createElement('div');
      header.className = 'weekday-header';
      header.textContent = w;
      grid.appendChild(header);
    });

    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'grid-day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'grid-day-cell';
      const monthFormatted = String(currentMonth).padStart(2, '0');
      const dayFormatted = String(d).padStart(2, '0');
      const dateKey = `${currentYear}-${monthFormatted}-${dayFormatted}`;
      const eventText = events[dateKey] || '';

      cell.innerHTML = `
        <div class="grid-day-num">${d}</div>
        ${eventText ? `<div class="grid-day-event">${escapeHtml(eventText)}</div>` : ''}
      `;

      cell.onclick = () => jumpToRow(d);
      grid.appendChild(cell);
    }
  }

  function renderCalendarTable() {
    const tbody = document.getElementById('calendarTableBody');
    tbody.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

    for (let d = 1; d <= daysInMonth; d++) {
      const dayOfWeek = weekdays[new Date(currentYear, currentMonth - 1, d).getDay()];
      const monthFormatted = String(currentMonth).padStart(2, '0');
      const dayFormatted = String(d).padStart(2, '0');
      const dateStr = `${monthFormatted}/${dayFormatted}`;
      const dateKey = `${currentYear}-${monthFormatted}-${dayFormatted}`;
      const eventText = events[dateKey] || '';

      const tr = document.createElement('tr');
      tr.id = `row-${d}`;
      tr.innerHTML = `
        <td>${dateStr}</td>
        <td>${dayOfWeek}</td>
        <td>
          <input type="text" 
                 class="table-input" 
                 id="input-${d}"
                 value="${escapeHtml(eventText)}" 
                 placeholder="填寫行程..." 
                 onchange="updateEvent('${dateKey}', this.value)">
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  function jumpToRow(dayNum) {
    const row = document.getElementById(`row-${dayNum}`);
    const input = document.getElementById(`input-${dayNum}`);
    if (row && input) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('highlight-row');
      setTimeout(() => row.classList.remove('highlight-row'), 2000);
      input.focus();
    }
  }

  function updateEvent(dateKey, value) {
    const val = value.trim();
    if (val === '') {
      delete events[dateKey];
    } else {
      events[dateKey] = val;
    }
    saveData();
    renderCalendarGrid();
  }

  function saveData() {
    localStorage.setItem('my_blank_daily', JSON.stringify(dailyTasks));
    localStorage.setItem('my_blank_weekly', JSON.stringify(weeklyTasks));
    localStorage.setItem('my_month_goals', JSON.stringify(monthGoals));
    localStorage.setItem('my_blank_events', JSON.stringify(events));
  }

  function escapeHtml(text) {
    return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
  }

  init();
</script>
</body>
</html>
